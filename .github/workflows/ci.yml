name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  # Must match ATTRIBUTION.md / AGENTS.md (full SHA so a shallow fetch works).
  UPSTREAM_REPO: https://github.com/NVIDIA-Omniverse/usd-brep
  UPSTREAM_COMMIT: c9c5979f04cea8c38213004d4f04df0dcfb40d05  # c9c5979

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: nice -n 10 cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: nice -n 10 cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: nice -n 10 cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: rustup target add wasm32-unknown-unknown
      - run: nice -n 10 cargo check -p solidcore --target wasm32-unknown-unknown

  # Same packaging check the release workflow runs before publishing (no secrets).
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: nice -n 10 cargo publish -p solidcore --locked --dry-run

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  difftest:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      SOLIDCORE_CPP_DIR: ${{ github.workspace }}/.cpp
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no unit is green
        id: green
        run: |
          if [ -f plan/modules.toml ] && grep -Eq '^\s*status\s*=\s*"green"' plan/modules.toml; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No green units in plan/modules.toml; nothing to difftest."
          fi

      - name: Clone upstream at pinned commit
        if: steps.green.outputs.any == 'true'
        run: |
          git init upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT" \
            || git -C upstream fetch origin
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"

      - name: Install C++ build tools
        if: steps.green.outputs.any == 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++

      # The C++ build lives outside cargo's target dir (bin/): rust-cache's post-step
      # cleans bin/ before this cache saves, which once cached an empty bin/cpp.
      - name: Cache C++ reference build
        if: steps.green.outputs.any == 'true'
        uses: actions/cache@v4
        with:
          path: .cpp
          # Shims are compiled by solidcore-ffi, not by build.sh, so they stay out of the key.
          key: cpp-v2-${{ runner.os }}-${{ env.UPSTREAM_COMMIT }}-${{ hashFiles('harness/cpp/CMakeLists.txt', 'harness/cpp/build.sh', 'harness/cpp/stubs/**', 'harness/cpp/patches/**') }}

      - name: Build C++ reference (when the cache did not provide the libs)
        if: steps.green.outputs.any == 'true'
        run: |
          if [ -f .cpp/lib/libSMLib.a ] && [ -f .cpp/lib/libSM_API.a ] && [ -f .cpp/ffi.env ]; then
            echo "C++ reference restored from cache"
          else
            nice -n 10 harness/cpp/build.sh --jobs 2
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.green.outputs.any == 'true'
        with:
          workspaces: ". -> bin"
          key: difftest

      # The clippy job above cannot see code behind the cpp feature (ffi bindings and
      # the difftest unit runners); lint it here, where the C++ headers exist.
      # difftest/cpp enables solidcore-ffi/cpp and registers the runners.
      - name: Clippy with the C++ feature
        if: steps.green.outputs.any == 'true'
        run: nice -n 10 cargo clippy --workspace --all-targets --features difftest/cpp -- -D warnings

      - name: Differential regression and full sensitivity
        if: steps.green.outputs.any == 'true'
        run: |
          nice -n 10 cargo build --profile difftest -p difftest --features cpp
          nice -n 10 bin/difftest/difftest --green > /tmp/default.log 2>&1 &
          default_pid=$!
          nice -n 10 bin/difftest/difftest --green --perturb > /tmp/sensitivity.log 2>&1 &
          sensitivity_pid=$!
          default_status=0
          wait "$default_pid" || default_status=$?
          sensitivity_status=0
          wait "$sensitivity_pid" || sensitivity_status=$?
          cat /tmp/default.log
          cat /tmp/sensitivity.log
          test "$default_status" -eq 0
          test "$sensitivity_status" -eq 0

      - name: Native dispatch contract tests
        if: steps.green.outputs.any == 'true'
        run: nice -n 10 cargo test -p solidcore-ffi --features cpp dispatch_contract_tests

      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difftest-reports
          path: reports/difftest
          retention-days: 7
